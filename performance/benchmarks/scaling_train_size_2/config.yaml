name: scaling_train_size
defaults: ../configs/_base.yaml

device: cuda
dtype: float32
# Reuses every default; only overrides the swept axis and seeds.
# seeds: [0, 1, 2]
fixed:
  model:
      n_layers: 64
      conditioner:
        args:
          num_layers: 4
  training:
    steps: 100_000
sweep:
  data.n_orbits: [512] #[8, 32, 128, 512]
  data.n_steps: [32, 128, 512] #[32, 128, 512, 2056]
